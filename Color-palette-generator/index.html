<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
<div class="container">
    <h1>Color Palette Generator</h1>
    <button id="generate-btn" >
        <i class="fas fa-sync-alt"></i>
        Generate Palette
    </button>

    <div class="palette-container">
        <!--color Box 1-->
        <div class="color-box">
            <div class="color" style="background-color: #0894d5;"></div>
            <div class="color-info">
                <span class="hex-value">#0894D5</span>
                <i class="far fa-copy copy-btn" title="copy to clipboard"></i>
            </div>
        </div>
         <!--color Box 2-->
        <div class="color-box">
            <div class="color" style="background-color: #e1f5fe;"></div>
            <div class="color-info">
                <span class="hex-value">#E1F5FD</span>
                <i class="far fa-copy copy-btn" title="copy to clipboard"></i>
            </div>
        </div>
         <!--color Box 3-->
        <div class="color-box">
            <div class="color" style="background-color: #3d0454;"></div>
            <div class="color-info">
                <span class="hex-value">#3D0454</span>
                <i class="far fa-copy copy-btn" title="copy to clipboard"></i>
            </div>
        </div>
         <!--color Box 4-->
        <div class="color-box">
            <div class="color" style="background-color: #e005fe;"></div>
            <div class="color-info">
                <span class="hex-value">#E005FE</span>
                <i class="far fa-copy copy-btn" title="copy to clipboard"></i>
            </div>
        </div>
         <!--color Box 5-->
        <div class="color-box">
            <div class="color" style="background-color: #11F5FE;"></div>
            <div class="color-info">
                <span class="hex-value">#11F5FE</span>
                <i class="far fa-copy copy-btn" title="copy to clipboard"></i>
            </div>
        </div>
    </div>
</div>
    <script src="script.js"></script>
</body>
</html>
